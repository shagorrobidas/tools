<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image to PDF Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="card p-4 col-md-6 mx-auto">
        <h2 class="text-center mb-4">🖼️ Image to PDF Converter</h2>

        <!-- Show error -->
        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <!-- Upload form -->
        <form method="POST" enctype="multipart/form-data" class="mb-3">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Upload Images</label>
                <input type="file" name="images" class="form-control" multiple required>
                <div class="form-text">You can select multiple images (JPG, PNG)</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Convert to PDF</button>
        </form>

        <!-- Success message -->
        {% if pdf_url %}
            <div class="alert alert-success text-center">
                ✅ PDF Generated Successfully!
                <br>
                <a href="{{ pdf_url }}" class="btn btn-success mt-3" download>⬇️ Download PDF</a>
            </div>
        {% endif %}
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
