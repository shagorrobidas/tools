<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Tools Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }
        .card {
            border-radius: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .dashboard-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <h1 class="text-center dashboard-title">⚡ My Tools Dashboard</h1>

    <div class="row g-4">
        <!-- URL Shortener -->
        <div class="col-md-4">
            <a href="{% url 'url_shortener' %}" class="text-decoration-none">
                <div class="card p-4 text-center h-100">
                    <h3>🔗 URL Shortener</h3>
                    <p class="text-muted">Convert long links into short, shareable links.</p>
                </div>
            </a>
        </div>

        <!-- Images to PDF -->
        <div class="col-md-4">
            <a href="{% url 'images_to_pdf' %}" class="text-decoration-none">
                <div class="card p-4 text-center h-100">
                    <h3>🖼️ Images to PDF</h3>
                    <p class="text-muted">Upload multiple images and generate a single PDF file.</p>
                </div>
            </a>
        </div>

        <!-- Add future tools -->
        <div class="col-md-4">
            <a href="#" class="text-decoration-none">
                <div class="card p-4 text-center h-100">
                    <h3>📄 Coming Soon</h3>
                    <p class="text-muted">More useful tools will appear here.</p>
                </div>
            </a>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
