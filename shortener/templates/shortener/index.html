{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
        background: #f8f9fa;
        }
        .card {
        border-radius: 20px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
    </style>
    </head>
    <body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 col-md-6">
        <h3 class="text-center mb-3">🔗 URL Shortener</h3>

        <div class="mb-3">
        <label class="form-label">Enter your URL</label>
        <input type="url" id="urlInput" class="form-control" placeholder="https://example.com" required>
        </div>
        <button id="generateBtn" class="btn btn-primary w-100">Generate Short Link</button>
    </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="shortUrlModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">✅ Short Link Generated</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
            <p>Your short link:</p>
            <a id="shortLink" href="#" target="_blank" class="fw-bold"></a>
            <div class="mt-3">
            <button class="btn btn-outline-secondary" onclick="copyLink()">📋 Copy</button>
            </div>
        </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.getElementById("generateBtn").addEventListener("click", function() {
        const url = document.getElementById("urlInput").value;
        if (!url) {
        alert("Please enter a valid URL");
        return;
        }

        fetch("/api/shorten/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify({ original_url: url })
        })
        .then(res => res.json())
        .then(data => {
        if (data.short_url) {
            const linkEl = document.getElementById("shortLink");
            linkEl.href = data.short_url;
            linkEl.textContent = data.short_url;

            const modal = new bootstrap.Modal(document.getElementById("shortUrlModal"));
            modal.show();
        } else {
            alert("Error: " + JSON.stringify(data));
        }
        });
    });

    function copyLink() {
        const link = document.getElementById("shortLink").href;
        navigator.clipboard.writeText(link);

        const copyBtn = event.target;
        copyBtn.textContent = "✅ Copied";

        setTimeout(() => {
            copyBtn.textContent = "📋 Copy";
        }, 2000); // Reset back after 2 seconds
    }

    // CSRF token helper
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + "=")) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
            }
        }
        }
        return cookieValue;
    }
    </script>
    </body>
</html>
