# render.yaml
# Blueprint for deploying the Shotter Django application on Render.

services:
  - type: web
    name: shotter-web
    env: python
    plan: free # Or a paid plan for production use
    region: oregon # Optional: choose a region closer to your users
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate
    startCommand: "gunicorn urlshortener.wsgi:application"
    # NOTE: You must manually add your DATABASE_URL environment variable
    # in the Render dashboard for this service.
    envVars:
      - key: SECRET_KEY
        generateValue: true # Automatically generates a secure secret key
      - key: PYTHON_VERSION
        value: 3.11.9 # Specify a full major.minor.patch version
      - key: WEB_CONCURRENCY
        value: 4 # Number of Gunicorn workers
